name: Deploy backend

# Run manually: GitHub -> Actions -> "Deploy backend" -> Run workflow
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF TELEGRAM_BOT_TOKEN ANTHROPIC_API_KEY ELEVENLABS_API_KEY ADMIN_SECRET; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret: $name"; missing=1; fi
          done
          exit $missing

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Apply database migrations
        run: supabase db push --yes

      - name: Set function secrets
        run: |
          supabase secrets set --project-ref "$PROJECT_REF" \
            TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN" \
            ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            ELEVENLABS_API_KEY="$ELEVENLABS_API_KEY" \
            ADMIN_SECRET="$ADMIN_SECRET"
          if [ -n "$OWNER_TELEGRAM_ID" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" OWNER_TELEGRAM_ID="$OWNER_TELEGRAM_ID"
          fi

      - name: Deploy functions
        run: supabase functions deploy --project-ref "$PROJECT_REF"

      - name: Register Telegram webhook and cron
        run: |
          sleep 10
          curl --fail-with-body -sS -X POST \
            "https://$PROJECT_REF.supabase.co/functions/v1/setup" \
            -H "x-admin-secret: $ADMIN_SECRET"
