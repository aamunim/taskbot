name: Build Android APK

# Run manually: GitHub -> Actions -> "Build Android APK" -> Run workflow.
# The APK appears under "Artifacts" on the finished run.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Optional: your own Expo project for over-the-air updates (see app/app.config.js).
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
      # Where the web version lives, so the app can build the link to the boss's page.
      EXPO_PUBLIC_WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repository secret: SUPABASE_PROJECT_REF or SUPABASE_ANON_KEY"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: taskbot-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
