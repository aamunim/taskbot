name: Deploy web app

# Publishes the web version of the app to GitHub Pages:
#   https://<owner>.github.io/taskbot/
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
# Run manually: GitHub -> Actions -> "Deploy web app" -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read # lets the deploy step find the uploaded site
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Optional: your own Expo project for over-the-air updates (see app/app.config.js).
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
      # Where the web version lives, so the app can build the link to the boss's page.
      EXPO_PUBLIC_WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$PROJECT_REF" ] || [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing repository secret: SUPABASE_PROJECT_REF or SUPABASE_ANON_KEY"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
        working-directory: app

      - name: Build web app
        working-directory: app
        run: |
          npx expo export --platform web
          # GitHub Pages has no rewrite rules: serving the app for unknown paths
          # lets deep links and page reloads work.
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - id: deployment
        uses: actions/deploy-pages@v4
