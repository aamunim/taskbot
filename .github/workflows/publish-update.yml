name: Publish app update

# Sends the current app code to every installed copy of the app (EAS Update).
# Run manually: GitHub -> Actions -> "Publish app update" -> Run workflow.
# Changes that add native modules still need a new APK ("Build Android APK").
on:
  workflow_dispatch:
    inputs:
      message:
        description: What changed (shown in the Expo dashboard)
        required: false
        default: Update

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      # Optional: your own Expo project for over-the-air updates (see app/app.config.js).
      EXPO_PROJECT_ID: ${{ secrets.EXPO_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
      # Where the web version lives, so the app can build the link to the boss's page.
      EXPO_PUBLIC_WEB_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      UPDATE_MESSAGE: ${{ inputs.message }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          missing=0
          for name in EXPO_TOKEN PROJECT_REF EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret for $name"; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci

      - name: Make sure the production channel exists
        run: npx --yes eas-cli@latest channel:create production --non-interactive || true

      - name: Publish update
        run: >
          npx --yes eas-cli@latest update --branch production
          --platform android --message "$UPDATE_MESSAGE" --non-interactive
